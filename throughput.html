        // 初始化图表
        const plotDiv = document.getElementById('throughput-plot');
        Plotly.newPlot(plotDiv, throughputData.data, throughputData.layout, {
            responsive: true,
            displayModeBar: true,
            modeBarButtonsToRemove: ['lasso2d', 'select2d']
        });

        // 从 URL 参数加载初始状态
        function loadInitialState() {
            const params = new URLSearchParams(window.location.search);
            const configs = params.get('configs');

            if (configs) {
                const configList = configs.split(',');
                configList.forEach(config => {
                    const button = document.querySelector(`.config-button[data-config="${config}"]`);
                    if (button) {
                        // 不自动设置为 active，只显示曲线
                        const traceIndex = throughputData.data.findIndex(t =>
                            t.meta && t.meta.configuration === config
                        );
                        if (traceIndex !== -1) {
                            Plotly.restyle(plotDiv, { visible: true }, [traceIndex]);
                        }
                    }
                });
            }
        }

        // 切换 throughput 曲线显示
        function toggleThroughput(configKey) {
            const button = document.querySelector(`.config-button[data-config="${configKey}"]`);
            if (!button) return;

            // 查找对应的 trace
            const traceIndex = throughputData.data.findIndex(t =>
                t.meta && t.meta.configuration === configKey
            );

            if (traceIndex === -1) {
                console.warn(`Throughput trace not found for ${configKey}`);
                return;
            }

            // 切换可见性
            const isVisible = plotDiv.data[traceIndex].visible !== false;
            Plotly.restyle(plotDiv, { visible: !isVisible }, [traceIndex]);

            // 更新按钮样式
            if (isVisible) {
                button.classList.remove('active');
                button.style.background = 'white';
                button.style.borderColor = '#E5E7EB';
                button.style.color = '#374151';
            } else {
                button.classList.add('active');
                button.style.background = '#EFF6FF';
                button.style.borderColor = '#2563EB';
                button.style.color = '#2563EB';
            }
        }

        // 设置观测模式（预留功能，当前所有数据都是 MOS 模式）
        function setMode(mode) {
            // 更新按钮样式
            document.querySelectorAll('.mode-button').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeButton = document.querySelector(`.mode-button[data-mode="${mode}"]`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            // TODO: 如果有不同模式的数据，可以在这里切换
            console.log(`Mode set to: ${mode}`);
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadInitialState();
        });
