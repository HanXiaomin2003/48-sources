<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 12px; }
        .subtitle {
            font-size: 14px; color: #666;
            margin-bottom: 32px; line-height: 1.6;
        }
        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: #444; margin-bottom: 8px; text-transform: uppercase;
        }
        input[type="password"] {
            width: 100%; padding: 16px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 16px; transition: border-color 0.3s;
        }
        input[type="password"]:focus {
            outline: none; border-color: #4a90e2;
        }
        button {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .message {
            margin-top: 24px; padding: 14px;
            border-radius: 8px; font-size: 14px;
        }
        .error { background: #fee; color: #c33; }
        .success { background: #efe; color: #3c3; }
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid #fff; border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #site-container { display: none; }
        #site-container.loaded { display: block; width: 100%; min-height: 100vh; }
    </style>
</head>
<body>
    <div class="container" id="lockScreen">
        <div class="icon">🔒</div>
        <h1>Protected Site</h1>
        <p class="subtitle">Client-side encrypted site<br>Password never leaves your browser</p>

        <form id="form">
            <div class="input-group">
                <label for="pwd">Password</label>
                <input type="password" id="pwd" required autofocus>
            </div>
            <button type="submit" id="btn"><span id="btnText">Unlock</span></button>
            <div id="msg" class="message"></div>
        </form>
    </div>

    <div id="site-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <script>
    const form = document.getElementById('form');
    const pwd = document.getElementById('pwd');
    const btn = document.getElementById('btn');
    const btnText = document.getElementById('btnText');
    const msg = document.getElementById('msg');
    const lockScreen = document.getElementById('lockScreen');
    const siteContainer = document.getElementById('site-container');

    let manifest = null;
    let vfs = {}; // 虚拟文件系统
    let currentPath = 'index.html'; // 当前路径
    let loadedScripts = new Set(); // 已加载的脚本
    let activeBlobUrls = new Set(); // 跟踪创建的 blob URL

    function showMsg(text, type) {
        msg.textContent = text;
        msg.className = 'message ' + type;
    }

    function setLoading(loading) {
        btn.disabled = loading;
        btnText.innerHTML = loading ? '<span class="spinner"></span>Processing...' : 'Unlock';
    }

    function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    async function deriveKey(password, salt, iter) {
        const enc = new TextEncoder();
        const key = await crypto.subtle.importKey(
            'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
        );
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
            key, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
    }

    async function decryptFile(ciphertext, key, iv, tag) {
        const data = new Uint8Array(ciphertext.length + tag.length);
        data.set(ciphertext);
        data.set(tag, ciphertext.length);

        return crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: iv }, key, data
        );
    }

    // 路径归一化：处理 ../ 和 ./
    function normalizePath(path, basePath = '/') {
        // 获取当前文件所在目录
        const currentDir = basePath.split('/').slice(0, -1).join('/');

        // 解析路径段
        const pathParts = path.split('/').filter(p => p && p !== '.');
        let result = currentDir ? currentDir.split('/').filter(p => p && p !== '.') : [];

        for (const part of pathParts) {
            if (part === '..') {
                result.pop();
            } else if (part !== '.') {
                result.push(part);
            }
        }

        return result.join('/');
    }

    // 在 VFS 中查找文件，支持路径归一化
    function resolvePath(path, basePath = '/') {
        // 如果是绝对路径（相对于网站根目录，以 / 开头）
        if (path.startsWith('/')) {
            const clean = path.substring(1);
            if (vfs[clean]) return clean;
        }

        // 处理相对路径
        const normalized = normalizePath(path, basePath);

        // 尝试归一化路径
        if (vfs[normalized]) {
            return normalized;
        }

        // 尝试原始路径
        if (vfs[path]) {
            return path;
        }

        // 尝试加上当前目录
        const currentDir = basePath.split('/').slice(0, -1).join('/');
        const fullPath = currentDir ? `${currentDir}/${path}` : path;

        if (vfs[fullPath]) {
            return fullPath;
        }

        console.warn('Path not found in VFS:', path, 'tried:', normalized, fullPath);
        return path;
    }

    async function unlock(password) {
        try {
            setLoading(true);
            showMsg('Loading...', 'success');

            // 下载清单
            const manifestResp = await fetch('manifest.json');
            manifest = await manifestResp.json();

            showMsg('Downloading core files...', 'success');

            // 下载核心包
            const coreResp = await fetch('core.enc');
            const coreData = new Uint8Array(await coreResp.arrayBuffer());

            showMsg('Decrypting...', 'success');

            // 解析加密参数
            const coreMeta = manifest.core.meta;
            const salt = b64ToBytes(coreMeta.salt);
            const iv = b64ToBytes(coreMeta.iv);
            const tag = b64ToBytes(coreMeta.tag);
            const ciphertext = coreData.slice(48);

            // 派生密钥并解密
            const key = await deriveKey(password, salt, manifest.iterations);
            const decrypted = await decryptFile(ciphertext, key, iv, tag);

            // 解压 ZIP 到虚拟文件系统
            const zip = await JSZip.loadAsync(decrypted);

            for (const [path, entry] of Object.entries(zip.files)) {
                if (!entry.dir) {
                    const content = await entry.async('uint8array');
                    // 处理路径：移除开头的点
                    let cleanPath = path.replace(/^\.\//, '').replace(/\\/g, '/');
                    vfs[cleanPath] = content;
                }
            }

            console.log('Loaded files:', Object.keys(vfs).length);
            console.log('Sample files:', Object.keys(vfs).slice(0, 20));

            // 显示首页
            await loadSite();

            showMsg('✓ Unlocked successfully!', 'success');

            setTimeout(() => {
                lockScreen.style.display = 'none';
                siteContainer.classList.add('loaded');
                document.body.style.background = '';
            }, 500);

        } catch (e) {
            console.error(e);
            showMsg('Password incorrect or decryption failed', 'error');
        } finally {
            setLoading(false);
        }
    }

    // 创建 blob URL 并跟踪
    function createTrackedBlobUrl(data, mimeType) {
        const blob = new Blob([data], { type: mimeType });
        const url = URL.createObjectURL(blob);
        activeBlobUrls.add(url);
        return url;
    }

    // 清理旧的 blob URL
    function cleanupBlobUrls() {
        activeBlobUrls.forEach(url => {
            try {
                URL.revokeObjectURL(url);
            } catch (e) {
                // 忽略已失效的 URL
            }
        });
        activeBlobUrls.clear();
    }

    async function loadSite() {
        let html = null;
        for (const name of ['index.html', 'index.htm']) {
            if (vfs[name]) {
                html = new TextDecoder().decode(vfs[name]);
                currentPath = 'index.html';
                break;
            }
        }

        if (!html) throw new Error('index.html not found');

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // 处理样式
        doc.querySelectorAll('head style').forEach(el => {
            const s = document.createElement('style');
            s.textContent = el.textContent;
            s.setAttribute('data-page', 'index');
            document.head.appendChild(s);
        });

        // 加载外部脚本（如 Plotly）
        const externalScripts = [];
        doc.querySelectorAll('head script[src]').forEach(el => {
            const src = el.getAttribute('src');
            if (src && !loadedScripts.has(src)) {
                externalScripts.push(src);
                loadedScripts.add(src);
            }
        });

        // 等待外部脚本加载完成
        for (const src of externalScripts) {
            await loadExternalScript(src);
        }

        // 设置 body 内容
        siteContainer.innerHTML = doc.body.innerHTML;

        // 移除所有源项的 onclick 属性
        siteContainer.querySelectorAll('.source-item').forEach(item => {
            item.removeAttribute('onclick');
        });

        // 设置事件委托处理源点击
        setupSourceDelegation();

        // 处理所有资源（图片）
        processAllResources();

        // 设置链接拦截
        setupLinkInterception();

        console.log('Site loaded successfully');
    }

    // 加载外部脚本
    function loadExternalScript(src) {
        return new Promise((resolve, reject) => {
            // 检查是否已加载
            if (document.querySelector(`script[src="${src}"]`)) {
                resolve();
                return;
            }

            const script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }

    // 设置源列表点击委托（全局处理所有页面的源点击）
    function setupSourceDelegation() {
        // 移除旧的事件监听器（通过克隆节点）
        const newContainer = siteContainer.cloneNode(false);
        siteContainer.parentNode.replaceChild(newContainer, siteContainer);
        // 恢复引用
        const container = document.getElementById('site-container');

        container.addEventListener('click', function(e) {
            const sourceItem = e.target.closest('.source-item[data-srcid]');
            if (!sourceItem) return;

            e.preventDefault();
            e.stopPropagation();

            const srcid = sourceItem.getAttribute('data-srcid');
            console.log('Source clicked:', srcid, 'from path:', currentPath);

            // 如果当前已经在该源的详情页，不做任何事
            if (currentPath === `sources/${srcid}.html`) {
                console.log('Already on this source page');
                return;
            }

            // 更新选中状态（更新所有源列表）
            container.querySelectorAll('.source-item[data-srcid]').forEach(item => {
                if (item.getAttribute('data-srcid') === srcid) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // 加载详情页
            const resolvedPath = `sources/${srcid}.html`;
            console.log('Loading source page:', resolvedPath);
            loadPage(resolvedPath, `sources/${srcid}.html`);
        }, true);
    }

    // 处理所有资源（图片、CSS、背景图等）
    function processAllResources() {
        // 清理旧的 blob URL
        cleanupBlobUrls();

        // 处理图片
        siteContainer.querySelectorAll('img').forEach(img => {
            const src = img.getAttribute('src');
            if (src) {
                const resolvedPath = resolvePath(src, currentPath);
                console.log('Image:', src, '->', resolvedPath, 'exists:', !!vfs[resolvedPath]);

                if (vfs[resolvedPath]) {
                    const mimeType = getMimeType(resolvedPath);
                    const blobUrl = createTrackedBlobUrl(vfs[resolvedPath], mimeType);
                    img.src = blobUrl;
                } else {
                    console.warn('Image not found:', resolvedPath);
                    // 尝试备用路径
                    const fallbackPath = src.replace('../', '');
                    if (vfs[fallbackPath]) {
                        const mimeType = getMimeType(fallbackPath);
                        const blobUrl = createTrackedBlobUrl(vfs[fallbackPath], mimeType);
                        img.src = blobUrl;
                    }
                }
            }
        });

        // 处理 CSS 中的背景图
        const processBackgrounds = (element) => {
            if (!element || !element.style) return;

            const computedStyle = window.getComputedStyle(element);
            const bgImage = computedStyle.backgroundImage;

            if (bgImage && bgImage !== 'none' && bgImage.includes('url(')) {
                const urlMatch = bgImage.match(/url\(['"]?([^'")]+)['"]?\)/);
                if (urlMatch && urlMatch[1]) {
                    const imagePath = urlMatch[1];
                    const resolvedPath = resolvePath(imagePath, currentPath);

                    if (vfs[resolvedPath]) {
                        const mimeType = getMimeType(resolvedPath);
                        const blobUrl = createTrackedBlobUrl(vfs[resolvedPath], mimeType);
                        element.style.backgroundImage = `url('${blobUrl}')`;
                        console.log('Background:', imagePath, '->', resolvedPath);
                    }
                }
            }

            // 递归处理子元素
            Array.from(element.children).forEach(processBackgrounds);
        };

        processBackgrounds(siteContainer);
    }

    // 拦截链接跳转
    function setupLinkInterception() {
        siteContainer.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (!link) return;

            const href = link.getAttribute('href');
            if (!href) return;

            console.log('Link clicked:', href, 'from:', currentPath);

            // 处理外部链接
            if (href.startsWith('http://') || href.startsWith('https://')) {
                e.preventDefault();
                window.open(href, '_blank');
                return;
            }

            // 处理锚点链接
            if (href.startsWith('#')) {
                return;
            }

            // 处理页面跳转
            e.preventDefault();
            e.stopPropagation();

            const resolvedPath = resolvePath(href, currentPath);
            console.log('Loading page:', href, '->', resolvedPath, 'from:', currentPath);

            loadPage(resolvedPath, href);
        }, true);
    }

    async function loadPage(resolvedPath, originalPath) {
        if (!vfs[resolvedPath]) {
            console.error('Page not found:', resolvedPath);
            console.log('Available files:', Object.keys(vfs).slice(0, 30));
            console.log('Current path:', currentPath);
            alert('Page not found: ' + originalPath);
            return;
        }

        console.log('Loading page:', resolvedPath);

        // 加载新页面
        const html = new TextDecoder().decode(vfs[resolvedPath]);
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // 更新当前路径
        currentPath = resolvedPath;

        // 清理旧的 blob URL
        cleanupBlobUrls();

        // 加载页面的样式（重要：详情页的样式在 head 中）
        doc.querySelectorAll('head style').forEach(el => {
            // 检查是否已存在相同内容的样式
            const existingStyle = Array.from(document.head.querySelectorAll('style[data-page]'))
                .find(s => s.textContent === el.textContent);
            if (!existingStyle) {
                const s = document.createElement('style');
                s.textContent = el.textContent;
                s.setAttribute('data-page', resolvedPath);
                document.head.appendChild(s);
            }
        });

        // 清理旧页面的样式
        document.head.querySelectorAll('style[data-page]').forEach(el => {
            const pagePath = el.getAttribute('data-page');
            if (pagePath !== resolvedPath && pagePath !== 'index') {
                el.remove();
            }
        });

        // 更新内容
        siteContainer.innerHTML = doc.body.innerHTML;

        // 移除所有源项的 onclick 属性
        siteContainer.querySelectorAll('.source-item').forEach(item => {
            item.removeAttribute('onclick');
        });

        // 重新设置事件委托
        setupSourceDelegation();

        // 处理所有资源（图片）
        processAllResources();

        // 重新设置链接拦截
        setupLinkInterception();

        // 等待 Plotly 库（如果页面需要）
        if (typeof Plotly === 'undefined') {
            await loadExternalScript('https://cdn.plot.ly/plotly-2.27.0.min.js');
        }

        // 执行页面脚本（包括生成光谱图）
        const scripts = doc.querySelectorAll('script');
        for (const scriptEl of scripts) {
            if (scriptEl.src) {
                const src = scriptEl.getAttribute('src');
                if (!loadedScripts.has(src)) {
                    await loadExternalScript(src);
                    loadedScripts.add(src);
                }
            } else if (scriptEl.textContent.trim()) {
                // 执行内联脚本
                try {
                    const newScript = document.createElement('script');
                    newScript.textContent = scriptEl.textContent;
                    siteContainer.appendChild(newScript);
                } catch (e) {
                    console.error('Error executing script:', e);
                }
            }
        }

        console.log('Page loaded:', resolvedPath);
    }

    function getMimeType(path) {
        const ext = path.split('.').pop().toLowerCase();
        const types = {
            png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
            gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp',
            css: 'text/css', js: 'application/javascript',
            html: 'text/html', ico: 'image/x-icon'
        };
        return types[ext] || 'application/octet-stream';
    }

    form.onsubmit = e => {
        e.preventDefault();
        const p = pwd.value;
        if (!p) { showMsg('Enter password', 'error'); return; }
        unlock(p);
    };
    </script>
</body>
</html>
